[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    contract: asserts docs/API.md and the FastAPI app agree
    live: needs a real bot-desktop container; set NESQ_LIVE_DESKTOP_URL to run it
filterwarnings =
    ignore::DeprecationWarning
